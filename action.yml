name: Release Announcer
description: Post a clean release changelog to Discord as an embed
inputs:
  webhook-url:
    description: Discord webhook URL. When empty, the step is skipped.
    required: false
  product:
    description: Product name, used as "<product> Update vX.Y.Z"
    required: true
  url:
    description: Link for the embed title
    required: false
  tag:
    description: Release tag, e.g. v1.2.3
    required: true
  source:
    description: "changelog: read this version's section of CHANGELOG.md on the default branch. release: read the GitHub release notes."
    required: false
    default: changelog
  dry-run:
    description: "true: post nothing, write a preview to the job summary"
    required: false
    default: 'false'
  repository:
    description: owner/name of the repository
    required: false
  github-token:
    description: Token used to read CHANGELOG.md or the GitHub release
    required: false
    default: ${{ github.token }}
  color:
    description: Embed color as a number, e.g. 0xef4444
    required: false
runs:
  using: node24
  main: src/main.mjs
